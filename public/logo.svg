<!-- Logo-Original (Vektor), seit dem 4.10.2026: „Versammelt" — drei Sitzreihen
     mit 4, 6 und 8 Plätzen um ein Rednerpult, von oben gesehen. Jede Reihe hat
     eine gerade Zahl, darum bleibt unter dem Pult ein Mittelgang frei.
     Flach, ohne Verläufe und Schatten, damit es auch als 16-px-Favicon trägt.
     Der viewBox umschließt die Kachel eng — die Polsterung für App-Icons
     (Safe-Zone) fügt scripts/make-icons.mjs hinzu, deren Hintergrund dort die
     Kachelfarbe ist (KACHEL). -->
