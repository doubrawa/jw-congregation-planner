<!-- Logo-Original (Vektor), seit dem 4.10.2026: „Versammelt" — drei Sitzreihen
     mit 4, 6 und 8 Plätzen um ein Rednerpult, von oben gesehen. Jede Reihe hat
     eine gerade Zahl, darum bleibt unter dem Pult ein Mittelgang frei.
     Flach, ohne Verläufe und Schatten. Quelle der App-Icons
     (scripts/make-icons.mjs, deren Hintergrund die Kachelfarbe ist); in der
     App zeichnet bausteine/Logo.tsx dieselbe Form ohne Kachel.
     Farben seit dem 15.10.2026 die der dunklen Darstellung (Graphit · Minze,
     T121): Kachel wie --karte, Plätze wie --text, Pult in --akzent — bis
     dahin Petrol, Creme und Gold. tests/logo-farben.test.ts hält beides
     gleich.
     Das Pult steht seit dem 16.10.2026 um 35 näher an den Reihen, Variante
     D des Betreibers: Die Lücke zur ersten Reihe gleicht nun der zwischen
     zwei Reihen (vorher doppelt so groß). Alles zusammen ist um 17,5 gehoben
     und steht weiter mittig in der Kachel. -->
