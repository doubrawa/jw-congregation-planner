<!-- Das Logo für kleine Größen (seit dem 4.10.2026): Favicon, Kopfzeile am Handy
     (22 px), Seitenleiste (40 px). Dieselben drei Bögen um das Pult wie
     logo.svg (Radien 112, 176, 240; 64 Einheiten Bogenabstand zwischen zwei
     Plätzen), aber nur 3, 5 und 7 Plätze und kräftigere Punkte — klein
     verschwammen die 18 Plätze von 4-6-8 zu Streifen. Bei ungerader Zahl
     steht ein Platz genau unter dem Pult. Groß (Anmeldung, App-Icons) bleibt
     logo.svg. Entworfen auf der Design-Fläche, Board „Klein · weniger Plätze". -->
