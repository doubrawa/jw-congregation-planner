<!-- Das Logo für kleine Größen (seit dem 4.10.2026): das Favicon. Dieselben
     drei Bögen wie logo.svg (Radien 112, 176, 240; 64 Einheiten
     Bogenabstand zwischen zwei Plätzen), aber nur 3, 5 und 7 Plätze und
     kräftigere Punkte — klein verschwammen die 18 Plätze von 4-6-8 zu
     Streifen. Bei ungerader Zahl steht ein Platz genau unter dem Pult. Menü
     und Druckbögen zeichnen dieselbe Form ohne Kachel (bausteine/Logo.tsx).
     Entworfen auf der Design-Fläche, Board „Klein · weniger Plätze".
     Farben seit dem 15.10.2026 die der dunklen Darstellung (Graphit · Minze,
     T121): Kachel wie --karte, Plätze wie --text, Pult in --akzent — bis
     dahin Petrol, Creme und Gold. tests/logo-farben.test.ts hält beides
     gleich.
     Das Pult steht seit dem 16.10.2026 um 35 tiefer als der Mittelpunkt der
     Bögen, Variante D des Betreibers: Die Lücke zur ersten Reihe gleicht nun
     der zwischen zwei Reihen (vorher 2,6-mal so groß). Alles zusammen ist um
     17,5 gehoben und steht weiter mittig in der Kachel. -->
