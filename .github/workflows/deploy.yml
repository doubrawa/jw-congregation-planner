name: Deploy to GitHub Pages

# Baut die Vite-App, rollt Datenbank und Edge Functions aus (ausrollen.yml) und
# veröffentlicht erst danach auf GitHub Pages — kein neues Frontend gegen alte
# Functions oder ein altes Schema (T170). „Run workflow" rollt alles aus.
# Voraussetzung: Repo-Einstellungen → Pages → Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Keine Sperre über den ganzen Lauf: Ein neuer Push bräche sonst ein laufendes
# Ausrollen mittendrin ab. Gesperrt wird je Job — das Ausrollen ohne Abbruch
# (in ausrollen.yml), das Veröffentlichen mit.

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Vor dem Bauen prüfen, nicht danach: ein roter Test soll das Deployment
      # verhindern, nicht bloß im Nachhinein melden. `npm run build` führt
      # zusätzlich `tsc -b` aus, deckt die Typen also ab.
      - run: npm run lint
      - run: npm test
      # Supabase-Konfiguration (optional): ohne Secrets entsteht eine App ohne
      # Datenbank — Testdaten enthält sie so wenig wie mit. Dafür steht die
      # Bündelwache im Build (scripts/testdaten-grenze.mjs): Ein Modul oder
      # Kennzeichen aus tests/testdaten/ im Ergebnis bricht ihn ab, und ein
      # solcher Stand geht nicht hinaus.
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      # Diese beiden gehören zusammen und werden nur gemeinsam gehoben: die eine
      # legt das Artefakt an, die andere holt es ab. `upload-pages-artifact`
      # bringt `upload-artifact` als eigene Abhängigkeit mit — deshalb nennt die
      # Deprecation-Meldung eine Action, die hier gar nicht steht.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # Nur von main: „Run workflow" lässt sich auf jedem Zweig starten, und dessen
  # Stand ginge sonst ungeprüft in die Produktion. Ohne Ausrollen kein
  # Veröffentlichen — `deploy` wartet darauf.
  ausrollen:
    needs: build
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ausrollen.yml
    secrets: inherit
    permissions:
      contents: read
      actions: read

  deploy:
    needs: [build, ausrollen]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # Nur ein Veröffentlichen gleichzeitig; ein neues bricht ein laufendes ab.
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
