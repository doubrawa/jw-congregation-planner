name: Deploy to GitHub Pages

# Baut die Vite-App und veröffentlicht sie auf GitHub Pages.
# Voraussetzung: Repo-Einstellungen → Pages → Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Nur ein Deployment gleichzeitig; laufende bei neuem Push abbrechen.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Vor dem Bauen prüfen, nicht danach: ein roter Test soll das Deployment
      # verhindern, nicht bloß im Nachhinein melden. `npm run build` führt
      # zusätzlich `tsc -b` aus, deckt die Typen also ab.
      - run: npm run lint
      # Sperrklinke fuer noUncheckedIndexedAccess (T42): schlaegt an, sobald
      # eine Datei mehr Meldungen bekommt als die Grundlinie erlaubt oder eine
      # neue hinzukommt. Die Zahl kann damit nur fallen.
      - run: npm run typecheck:index
      - run: npm test
      # Supabase-Konfiguration (optional): ohne Secrets baut der Demo-Modus
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      # Diese beiden gehören zusammen und werden nur gemeinsam gehoben: die eine
      # legt das Artefakt an, die andere holt es ab. `upload-pages-artifact`
      # bringt `upload-artifact` als eigene Abhängigkeit mit — deshalb nennt die
      # Deprecation-Meldung eine Action, die hier gar nicht steht.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
