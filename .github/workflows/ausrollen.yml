name: Ausrollen (Supabase)

# Datenbank und Edge Functions in die Produktion (T170) — aufgerufen aus
# deploy.yml zwischen Bauen und Veröffentlichen. Ein neues Frontend geht erst
# hinaus, wenn Schema und Functions stehen; scheitert hier etwas, hält das
# Veröffentlichen an.
#
# Kein Staging (Betreiber, 7.11.2026). Geprobt wird vorher im Build: `npm test`
# spielt schema.sql und die Migrationen in PGlite und vergleicht sie, und die
# Proben der Functions laufen dort mit. Nachher prüft scripts/ausrollen-pruefen.mjs
# lesend, dass die Produktion auf dem Stand des Commits steht.
#
# Was ausgerollt wird, entscheidet scripts/ausrollen-plan.mjs — gemessen am
# Commit des letzten grünen Deploys, damit eine Änderung aus einem roten Lauf
# nicht liegen bleibt. Von Hand gestartet (Run workflow bei deploy.yml) rollt
# es alles aus.
#
# Secret: SUPABASE_ACCESS_TOKEN (persönlicher Zugangstoken, angelegt am
# 7.11.2026 ohne Ablaufdatum). Ein Datenbank-Passwort braucht die CLI
# nicht: Ohne --password meldet sie sich über den Token mit einer kurzlebigen
# Rolle an. Der Token steht nur an den Schritten, die die CLI rufen — nicht an
# `npm ci`, dessen Installationsskripte die Umgebung sehen.

on:
  workflow_call:

permissions:
  contents: read
  actions: read

env:
  # Die Kennung steht ohnehin in der Adresse, die das Frontend-Bündel trägt.
  PROJEKT: izxrhrufdbpbuwbvxdqr
  # Eine feste Version: Eine neue CLI soll nicht ungefragt an der Produktion
  # arbeiten (CLI 3 hat Schalter umbenannt und `--yes` eingeführt).
  SUPABASE_CLI: supabase@3.0.0

jobs:
  ausrollen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Nie zwei zugleich, und nie mittendrin abbrechen: Ein halb gelaufenes
    # `functions deploy` ließe die Functions auf zwei Ständen zurück.
    concurrency:
      group: supabase-ausrollen
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Was ist auszurollen?
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ausrollen-plan.mjs >> "$GITHUB_OUTPUT"

      - name: Abhängigkeiten
        if: steps.plan.outputs.etwas == 'true'
        run: npm ci

      - name: Zugangstoken vorhanden?
        if: steps.plan.outputs.etwas == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Das Secret SUPABASE_ACCESS_TOKEN fehlt (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      # Ohne Trockenlauf davor: `db push` nennt selbst jede Migration, bevor
      # es sie einspielt („Applying migration …“).
      - name: Migrationen einspielen
        if: steps.plan.outputs.migrationen == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npx --yes "$SUPABASE_CLI" db push --remote="$PROJEKT" --yes

      # Einmal wiederholt: Die API meldete schon „deployed concurrently by
      # another request" (409), und schlichtes Wiederholen genügte.
      - name: Functions ausrollen
        if: steps.plan.outputs.functions == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          NAMEN: ${{ steps.plan.outputs.namen }}
        run: |
          for versuch in 1 2; do
            # shellcheck disable=SC2086 — die Namen sollen einzeln ankommen
            if npx --yes "$SUPABASE_CLI" functions deploy $NAMEN --remote="$PROJEKT" --use-api --yes; then exit 0; fi
            echo "::warning::functions deploy scheiterte (Versuch $versuch)"
            sleep 15
          done
          exit 1

      - name: Steht die Produktion auf dem Stand des Commits?
        if: steps.plan.outputs.etwas == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SEIT: ${{ steps.plan.outputs.functions == 'true' && steps.plan.outputs.start || '' }}
        run: node scripts/ausrollen-pruefen.mjs ${SEIT:+--functions-seit "$SEIT"}
