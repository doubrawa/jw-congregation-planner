<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <!-- Icons: logo.svg ist das Original, die PNGs erzeugt `npm run icons`.
         Der PNG-Favicon ist der Fallback für Browser ohne SVG-Favicon. -->
    <link rel="icon" type="image/svg+xml" href="logo.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Planner" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Zusammenkunfts-Planer für eine Versammlung — Wochenprogramme, Aufgaben zuteilen, Personenverwaltung." />
    <meta name="color-scheme" content="light dark" />
    <!-- Wird unten grob und in src/app/store.tsx exakt auf --bg des aktiven
         Themes gesetzt (nicht per media: der Nutzer kann ein helles Theme bei
         dunklem System wählen). -->
    <meta name="theme-color" content="#ffffff" />

    <!-- Farbschema vor dem ersten Paint setzen (kein Flackern). Schemata wie
         THEME_LIST in src/data/constants.ts; alte Werte light/dark gemappt. -->
    <script>
      (function () {
        try {
          var THEMES = {
            weiss: 0, indigo: 0, blatt: 0, papaya: 0, pastell: 0, grau: 0, kontrast: 0,
            graphit: 1, bernstein: 1, aubergine: 1, koralle: 1,
          }
          var stored = localStorage.getItem('theme')
          if (stored === 'light') stored = 'weiss'
          if (stored === 'dark') stored = 'graphit'
          // Standard ist Reinweiß, unabhängig von der System-Einstellung. Ein
          // dunkles Design wählt man bewusst im Profil (bleibt dann gespeichert).
          if (!(stored in THEMES)) stored = 'weiss'
          document.documentElement.dataset.theme = stored
          if (THEMES[stored]) document.documentElement.dataset.dark = '1'
          // Statusleiste sofort passend; store.tsx verfeinert auf --bg.
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.content = THEMES[stored] ? '#191a17' : '#ffffff'
          // Schriftgröße ebenfalls vor dem Paint (sonst springt die ganze
          // Seite). Stufen wie FONT_SCALES in src/data/constants.ts.
          var fs = localStorage.getItem('fontScale')
          if (['0.9', '1', '1.15', '1.3', '1.45'].indexOf(fs) >= 0) {
            document.documentElement.style.setProperty('--fs', fs)
          }
          // Sprache und Schreibrichtung ebenso vor dem Paint. store.tsx setzt
          // beides erst nach dem Mount — Arabisch, Hebräisch, Farsi und Urdu
          // rendern dadurch zuerst von links nach rechts und klappen dann um.
          // Liste wie RTL_LANGS in src/i18n/langs.ts.
          var lang = localStorage.getItem('lang')
          if (lang && /^[a-z]{2}$/.test(lang)) {
            document.documentElement.lang = lang
            document.documentElement.dir =
              ['ar', 'he', 'fa', 'ur'].indexOf(lang) >= 0 ? 'rtl' : 'ltr'
          }
        } catch (e) {
          /* localStorage nicht verfügbar — Standard bleibt Reinweiß */
        }
      })()
    </script>

    <!-- Schriften (Newsreader + IBM Plex Sans, OFL) liegen im Bündel:
         src/styles/fonts.css. Bis August 2026 kamen sie von fonts.googleapis.com
         — das meldete jede Nutzer-IP an einen Dritten und fiel ohne Netz zu
         diesem Host ganz aus. -->
    <title>Congregation Planner</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
