<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <!-- Icons: logo.svg ist das Original, die PNGs erzeugt `npm run icons`.
         Das Favicon ist die kleine Fassung (logo-klein.svg, 3-5-7 Plätze) —
         im Tab verschwammen die 18 Plätze zu Streifen. Der PNG-Favicon ist der
         Fallback für Browser ohne SVG-Favicon. -->
    <link rel="icon" type="image/svg+xml" href="logo-klein.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Versammlung.app" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Zusammenkünfte planen, Aufgaben verteilen, die Versammlung verwalten." />
    <meta name="color-scheme" content="light dark" />
    <!-- Wird unten und in src/app/darstellung.ts auf --grund der geltenden
         Palette gesetzt (nicht per media: man kann Hell bei dunklem Gerät
         wählen). -->
    <meta name="theme-color" content="#f1f1ef" />

    <!-- Darstellung vor dem ersten Paint setzen (kein Flackern): hell, dunkel
         oder wie das Gerät, wie THEME_LIST und asTheme in
         src/data/constants.ts. Die dunklen der elf alten Farbschemata werden
         „dunkel", alles andere „auto". -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme')
          if (['graphit', 'bernstein', 'aubergine', 'koralle', 'dark'].indexOf(stored) >= 0) stored = 'dunkel'
          // Ohne matchMedia würfe die Abfrage, und Schriftgröße und Leserichtung
          // unten blieben ungesetzt — dann eben Hell.
          var dunkel =
            stored === 'dunkel' ||
            (stored !== 'hell' && !!window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.theme = dunkel ? 'dunkel' : 'hell'
          // Statusleiste sofort passend: --grund der beiden Paletten (tokens.css).
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.content = dunkel ? '#121314' : '#f1f1ef'
          // Schriftgröße ebenfalls vor dem Paint (sonst springt die ganze
          // Seite). Stufen wie FONT_SCALES in src/data/constants.ts.
          var fs = localStorage.getItem('fontScale')
          if (['0.9', '1', '1.15', '1.3', '1.45'].indexOf(fs) >= 0) {
            document.documentElement.style.setProperty('--fs', fs)
          }
          // Sprache und Schreibrichtung ebenso vor dem Paint. store.tsx setzt
          // beides erst nach dem Mount — Arabisch und Farsi rendern dadurch
          // zuerst von links nach rechts und klappen dann um.
          // Liste wie RTL_LANGS in src/i18n/langs.ts.
          var lang = localStorage.getItem('lang')
          if (lang && /^[a-z]{2}$/.test(lang)) {
            document.documentElement.lang = lang
            document.documentElement.dir = ['ar', 'fa'].indexOf(lang) >= 0 ? 'rtl' : 'ltr'
          }
        } catch (e) {
          /* localStorage nicht verfügbar — es bleibt die helle Palette aus :root */
        }
      })()
    </script>

    <!-- Schriften (Manrope und die drei für Rechts-nach-links, OFL) liegen im
         Bündel: src/styles/fonts.css. Bis August 2026 kamen die damaligen von
         fonts.googleapis.com — das meldete jede Nutzer-IP an einen Dritten und
         fiel ohne Netz zu diesem Host ganz aus. -->
    <title>Versammlung.app</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
